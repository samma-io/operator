apiVersion: v2
name: samma-operator
description: Kubernetes operator that runs security scanners against the hosts your Ingresses serve
type: application
# version and appVersion move together: a release is a tag v<version>, and
# the release workflow refuses a tag that does not match this file.
version: 0.2.8
appVersion: "0.2.8"
kubeVersion: ">=1.25.0"
home: https://samma.io
sources:
  - https://github.com/samma-io/operator
  - https://github.com/samma-io/detect
maintainers:
  - name: Mattias Hemmingsson
    url: https://github.com/mattiashem
keywords:
  - security
  - scanning
  - operator
annotations:
  artifacthub.io/operator: "true"
  artifacthub.io/crds: |
    - kind: Scanner
      version: v1
      name: scanner.samma.io
      displayName: Scanner
      description: One target and the scanners to run against it.
    - kind: ScanReport
      version: v1alpha1
      name: scanreports.samma.io
      displayName: ScanReport
      description: The findings of one scanner against one target.
  artifacthub.io/changes: |
    - kind: fixed
      description: The bridge no longer drops the first scan of a Scanner created since its last Scanner list; a target the cached list lacks re-lists once, at most once a second.
    - kind: changed
      description: Detect scanners default to 2.0.3, which waits up to 10 seconds for the pod's network before scanning and keeps the IPv4 answer when IPv6 is unroutable.
    - kind: fixed
      description: Scan pods can reach the cluster's own ingress controller. Where the LoadBalancer address is a VIP, kube-proxy delivers in-cluster traffic for it to the controller's pods, which the samma-scanners policy refused as private addresses, so the HTTP scanners failed and the port and SSH scanners reported open ports as closed. networkPolicies.ingressControllers (default Traefik and ingress-nginx, serving ports only) opens exactly those pods and ports.
