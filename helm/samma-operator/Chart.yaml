apiVersion: v2
name: samma-operator
description: Kubernetes operator that runs security scanners against the hosts your Ingresses serve
type: application
# version and appVersion move together: a release is a tag v<version>, and
# the release workflow refuses a tag that does not match this file.
version: 0.2.7
appVersion: "0.2.7"
kubeVersion: ">=1.25.0"
home: https://samma.io
sources:
  - https://github.com/samma-io/operator
  - https://github.com/samma-io/detect
maintainers:
  - name: Mattias Hemmingsson
    url: https://github.com/mattiashem
keywords:
  - security
  - scanning
  - operator
annotations:
  artifacthub.io/operator: "true"
  artifacthub.io/crds: |
    - kind: Scanner
      version: v1
      name: scanner.samma.io
      displayName: Scanner
      description: One target and the scanners to run against it.
    - kind: ScanReport
      version: v1alpha1
      name: scanreports.samma.io
      displayName: ScanReport
      description: The findings of one scanner against one target.
  artifacthub.io/changes: |
    - kind: fixed
      description: scanners.maxConcurrentScans covers scheduled runs too. With a limit set, CronJobs create their Jobs suspended and the operator resumes them, oldest first, in the slots its queue leaves free; before, CronJob runs started on their own and could exceed the limit.
    - kind: added
      description: scanners.defaultSchedule sets the schedule of every Scanner that does not choose one (empty is weekly, "0 0 * * 0"); the chart refuses a value that is not five cron fields or an @-macro.
    - kind: changed
      description: The minute of a default schedule is derived from the CronJob's name instead of the target, so the scanners of one target spread over the hour instead of all firing at once.
    - kind: changed
      description: After an operator restart, each Scanner's CronJobs are brought up to what this release builds; an upgrade applies to existing Scanners without editing them.
