apiVersion: v2
name: samma-operator
description: Kubernetes operator that runs security scanners against the hosts your Ingresses serve
type: application
# version and appVersion move together: a release is a tag v<version>, and
# the release workflow refuses a tag that does not match this file.
version: 0.2.9
appVersion: "0.2.9"
kubeVersion: ">=1.25.0"
home: https://samma.io
sources:
  - https://github.com/samma-io/operator
  - https://github.com/samma-io/detect
maintainers:
  - name: Mattias Hemmingsson
    url: https://github.com/mattiashem
keywords:
  - security
  - scanning
  - operator
annotations:
  artifacthub.io/operator: "true"
  artifacthub.io/crds: |
    - kind: Scanner
      version: v1
      name: scanner.samma.io
      displayName: Scanner
      description: One target and the scanners to run against it.
    - kind: ScanReport
      version: v1alpha1
      name: scanreports.samma.io
      displayName: ScanReport
      description: The findings of one scanner against one target.
  artifacthub.io/changes: |
    - kind: added
      description: scanners.allowed (SAMMA_ALLOWED_SCANNERS) limits which scanners the operator runs, whatever a Scanner or an Ingress annotation asks for. A refused scanner gets a ScannerNotAllowed event and is skipped; a Scanner left with none is refused, and its CronJobs and waiting Jobs are deleted when the operator starts with the narrower list. Empty, the default, allows every scanner as before.
