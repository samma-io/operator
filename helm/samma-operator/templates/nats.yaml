{{- include "samma.consentGate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
      annotations:
        # A changed server config or password rolls the pod.
        checksum/nats-config: {{ include (print $.Template.BasePath "/nats-auth.yaml") . | sha256sum }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.nats.runAsUser }}
        runAsGroup: {{ .Values.nats.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          image: {{ include "samma.image" (dict "spec" .Values.nats "chart" .Chart) }}
          imagePullPolicy: {{ .Values.nats.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args: ["--config", "/etc/nats/nats-server.conf"]
          ports:
            - containerPort: 4222
            {{- if .Values.nats.monitoring }}
            - containerPort: 8222
            {{- end }}
          {{- if .Values.nats.auth.enabled }}
          env:
            - name: SAMMA_NATS_SCANNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nats.existingSecret | default "samma-nats-auth" }}
                  key: scanner-password
            - name: SAMMA_NATS_BRIDGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nats.existingSecret | default "samma-nats-auth" }}
                  key: bridge-password
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: nats-config
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    {{- if .Values.nats.monitoring }}
    - name: monitor
      port: 8222
      targetPort: 8222
    {{- end }}
  type: ClusterIP
