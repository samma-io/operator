{{- if .Values.api.enabled }}
{{- include "samma.consentGate" . -}}
{{- if not (or .Values.api.token .Values.api.existingSecret) }}
{{- fail "\n\napi.enabled is true but no API token is set. The API refuses to start without SAMMA_API_TOKEN (operator#15): every endpoint except the health probes and /metrics requires Authorization: Bearer <token>. Either\n\n  --set api.token=<token>\n\nor create a Secret with the key \"token\" and name it in api.existingSecret, or turn the API off with api.enabled=false (targets then come from Ingress annotations or Scanner resources alone).\n" }}
{{- end }}
{{- if not .Values.api.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: samma-api-token
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  token: {{ .Values.api.token | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: samma-api
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app: samma-api
  template:
    metadata:
      labels:
        app: samma-api
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.api }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.api.runAsUser }}
        runAsGroup: {{ .Values.api.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: samma-api
          image: {{ include "samma.image" (dict "spec" .Values.api "chart" .Chart) }}
          imagePullPolicy: {{ .Values.api.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SAMMA_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SAMMA_IO_ID
              value: {{ .Values.config.sammaIoId | quote }}
            - name: SAMMA_IO_TAGS
              value: {{ .Values.config.sammaIoTags | quote }}
            - name: SAMMA_IO_JSON
              value: {{ .Values.config.sammaIoJson | quote }}
            - name: WRITE_TO_FILE
              value: {{ .Values.config.writeToFile | quote }}
            - name: SAMMA_IO_API_URL
              value: {{ .Values.config.apiUrl | quote }}
            - name: SAMMA_IO_API_TOKEN
              value: {{ .Values.config.apiToken | quote }}
            - name: SAMMA_IO_PROFILE_ID
              value: {{ .Values.config.profileId | quote }}
            # The inbound bearer token the API requires (values api.token /
            # api.existingSecret). Not SAMMA_IO_API_TOKEN, the outbound token
            # for the samma.io portal.
            - name: SAMMA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.existingSecret | default "samma-api-token" }}
                  key: token
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: samma-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
{{- end }}
