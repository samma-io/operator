{{- if .Values.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    # Pod Security admission: baseline enforce (no privileged pods, no host
    # namespaces or paths, no added capabilities beyond NET_BIND_SERVICE),
    # restricted warn (violations logged, not blocked). No *-version labels:
    # admission uses its defaults.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
{{- end }}
