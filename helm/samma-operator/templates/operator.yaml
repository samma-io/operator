{{- include "samma.consentGate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: samma-operator
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app: samma-operator
  template:
    metadata:
      labels:
        app: samma-operator
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.operator }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.operator.runAsUser }}
        runAsGroup: {{ .Values.operator.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: samma-operator
          image: {{ include "samma.image" (dict "spec" .Values.operator "chart" .Chart) }}
          imagePullPolicy: {{ .Values.operator.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SAMMA_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SAMMA_IO_ID
              value: {{ .Values.config.sammaIoId | quote }}
            - name: SAMMA_IO_TAGS
              value: {{ .Values.config.sammaIoTags | quote }}
            - name: SAMMA_IO_JSON
              value: {{ .Values.config.sammaIoJson | quote }}
            - name: WRITE_TO_FILE
              value: {{ .Values.config.writeToFile | quote }}
            - name: NATS_URL
              value: {{ include "samma.natsUrl" . | quote }}
            - name: NATS_ENABLED
              value: {{ .Values.config.natsEnabled | quote }}
            - name: NATS_SUBJECT
              value: {{ .Values.config.natsSubject | quote }}
            - name: SAMMA_IO_API_URL
              value: {{ .Values.config.apiUrl | quote }}
            - name: SAMMA_IO_API_TOKEN
              value: {{ .Values.config.apiToken | quote }}
            - name: SAMMA_IO_PROFILE_ID
              value: {{ .Values.config.profileId | quote }}
            - name: SAMMA_ALLOW_PRIVATE_TARGETS
              value: {{ .Values.config.allowPrivateTargets | quote }}
            - name: SAMMA_ALLOW_UNMANAGED_TARGETS
              value: {{ .Values.config.allowUnmanagedTargets | quote }}
            # Extra namespaces whose Ingresses the operator handles; empty is
            # the operator's own namespace only, '*' is all namespaces.
            - name: SAMMA_INGRESS_NAMESPACES
              value: {{ join "," .Values.ingress.watchNamespaces | quote }}
            # Scanner Jobs and CronJobs (values.scanners)
            - name: SAMMA_SCANNER_SERVICE_ACCOUNT
              value: {{ .Values.serviceAccounts.scanner | quote }}
            - name: SAMMA_MAX_CONCURRENT_SCANS
              value: {{ .Values.scanners.maxConcurrentScans | quote }}
            - name: SAMMA_SCAN_DEADLINE_SECONDS
              value: {{ .Values.scanners.scanDeadlineSeconds | quote }}
            - name: SAMMA_JOB_TTL_SECONDS
              value: {{ .Values.scanners.ttlSecondsAfterFinished | quote }}
            - name: SAMMA_NMAP_RAW_SOCKETS
              value: {{ .Values.scanners.nmapRawSockets | quote }}
            - name: SAMMA_LEGACY_BASE_SCANNER
              value: {{ .Values.scanners.legacyBaseScanner | quote }}
            - name: SAMMA_SCANNER_RUN_AS_USER
              value: {{ .Values.scanners.runAsUser | quote }}
            - name: SAMMA_SCANNER_IMAGE_PREFIX
              value: {{ .Values.scanners.imagePrefix | quote }}
            - name: SAMMA_SCANNER_IMAGE_TAG
              value: {{ .Values.scanners.imageTag | quote }}
            - name: SAMMA_SCANNER_IMAGE_PULL_POLICY
              value: {{ .Values.scanners.pullPolicy | quote }}
            {{- /*
            The detect scanners are pinned to scanners.detectTag (README,
            "Scanner types"): every detect scanner without an entry in
            scanners.images gets a full reference here. imagePrefix and
            imageTag still apply, so a mirror works the same way for them.
            */}}
            {{- $registry := .Values.scanners.imagePrefix | default "ghcr.io/samma-io" | trimSuffix "/" }}
            {{- $detectTag := .Values.scanners.imageTag | default .Values.scanners.detectTag }}
            {{- range $name := .Values.scanners.detectScanners }}
            {{- if not (hasKey $.Values.scanners.images $name) }}
            - name: SAMMA_SCANNER_IMAGE_{{ $name | upper | replace "-" "_" }}
              value: {{ printf "%s/detect-%s:%s" $registry $name $detectTag | quote }}
            {{- end }}
            {{- end }}
            {{- range $name, $image := .Values.scanners.images }}
            - name: SAMMA_SCANNER_IMAGE_{{ $name | upper | replace "-" "_" }}
              value: {{ $image | quote }}
            {{- end }}
            - name: SAMMA_SCANNER_CPU_REQUEST
              value: {{ .Values.scanners.resources.requests.cpu | quote }}
            - name: SAMMA_SCANNER_MEMORY_REQUEST
              value: {{ .Values.scanners.resources.requests.memory | quote }}
            - name: SAMMA_SCANNER_CPU_LIMIT
              value: {{ .Values.scanners.resources.limits.cpu | quote }}
            - name: SAMMA_SCANNER_MEMORY_LIMIT
              value: {{ .Values.scanners.resources.limits.memory | quote }}
            # NATS credentials for scanner pods (README, "NATS authentication").
            # Empty means scanner pods connect without credentials.
            - name: SAMMA_NATS_SECRET
              value: {{ include "samma.natsSecret" . | quote }}
            - name: SAMMA_NATS_SCANNER_USER
              value: {{ .Values.nats.auth.scannerUser | quote }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: operator
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: samma-operator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
