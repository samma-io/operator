{{- if .Values.timescaledb.enabled }}
{{- include "samma.consentGate" . -}}
{{- if not (or .Values.timescaledb.password .Values.timescaledb.existingSecret) }}
{{- fail "\n\ntimescaledb.enabled is true but no password is set. The chart has no default password any more. Either\n\n  --set timescaledb.password=<alphanumeric password>\n\nor create a Secret with the key \"password\" and name it in timescaledb.existingSecret, or turn the database off with timescaledb.enabled=false (the bridge then writes ScanReports only).\n" }}
{{- end }}
{{- if not .Values.timescaledb.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: samma-timescaledb
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  password: {{ .Values.timescaledb.password | quote }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: timescaledb-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.timescaledb.storageClass }}
  storageClassName: {{ .Values.timescaledb.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.timescaledb.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timescaledb
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app: timescaledb
  template:
    metadata:
      labels:
        app: timescaledb
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: timescaledb
          image: {{ include "samma.image" (dict "spec" .Values.timescaledb "chart" .Chart) }}
          imagePullPolicy: {{ .Values.timescaledb.pullPolicy }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.timescaledb.db | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.timescaledb.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "samma.timescaledbSecret" . }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: data
          resources:
            {{- toYaml .Values.timescaledb.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: timescaledb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: timescaledb
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
{{- end }}
