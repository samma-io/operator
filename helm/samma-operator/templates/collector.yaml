{{- if .Values.collector.enabled }}
{{- include "samma.consentGate" . -}}
{{- /*
The collector (README, "Collector"): reads the results samma.io holds for
this cluster's opted-in Ingress hosts and serves them as Prometheus metrics,
plus one JSON log line per finding. Its only cluster right is reading
Ingresses; everything else it talks to is samma.io over HTTPS.
*/ -}}
{{- $c := .Values.collector }}
{{- if not (or $c.apiToken $c.existingSecret) }}
{{- fail "collector.enabled needs collector.apiToken or collector.existingSecret (a Secret with the key \"token\"): a samma.io API token, read-only is enough" }}
{{- end }}
{{- $secret := $c.existingSecret | default "samma-collector-token" }}
{{- if not $c.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: samma-collector-token
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  token: {{ $c.apiToken | quote }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.collector }}
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: samma-collector
rules:
  # Read only: the hosts of opted-in Ingresses decide what is exported.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: samma-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: samma-collector
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.collector }}
    namespace: {{ .Values.namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: samma-collector
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: samma-collector
  template:
    metadata:
      labels:
        app: samma-collector
      annotations:
        # Roll the pod when the chart-managed token changes.
        checksum/token: {{ printf "samma-collector:%s" $c.apiToken | sha256sum | trunc 16 | quote }}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.collector }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $c.runAsUser }}
        runAsGroup: {{ $c.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: samma-collector
          image: {{ include "samma.image" (dict "spec" $c "chart" .Chart) }}
          imagePullPolicy: {{ $c.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          env:
            - name: SAMMA_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SAMMA_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: SAMMA_IO_API_URL
              value: {{ $c.apiUrl | default .Values.config.apiUrl | quote }}
            - name: SAMMA_IO_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: token
            # The operator's Ingress namespaces: the same hosts it scans.
            - name: SAMMA_INGRESS_NAMESPACES
              value: {{ join "," .Values.ingress.watchNamespaces | quote }}
            - name: POLL_INTERVAL_SECONDS
              value: {{ $c.pollIntervalSeconds | quote }}
            - name: LOG_FINDINGS
              value: {{ $c.logFindings | quote }}
            - name: METRICS_PORT
              value: "9100"
          resources:
            {{- toYaml $c.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: samma-collector
  namespace: {{ .Values.namespace }}
  labels:
    app: samma-collector
  {{- if $c.scrapeAnnotations }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9100"
    prometheus.io/path: /metrics
  {{- end }}
spec:
  selector:
    app: samma-collector
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
      protocol: TCP
{{- if $c.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: samma-collector
  namespace: {{ .Values.namespace }}
  {{- with $c.serviceMonitor.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      app: samma-collector
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ $c.serviceMonitor.interval }}
{{- end }}
{{- if $c.grafanaDashboard.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: samma-findings-dashboard
  namespace: {{ $c.grafanaDashboard.namespace | default .Values.namespace }}
  {{- with $c.grafanaDashboard.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  samma-findings.json: |-
    {{- .Files.Get "dashboards/samma-findings.json" | nindent 4 }}
{{- end }}
{{- end }}
