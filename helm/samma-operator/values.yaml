# The operator performs active security scans, from inside the cluster,
# against the hosts the cluster's Ingresses serve (and against any target a
# Scanner resource names). Only scan hosts you are allowed to scan. The chart
# refuses to render the operator until this is true:
#
#   --set acceptScanningTerms=true
acceptScanningTerms: false

# Namespace to deploy into
namespace: samma-io

# Create the Namespace as part of the release (the upstream default). Set to
# false when the namespace exists already, for example when a GitOps tool or
# `helm install --create-namespace` makes it.
createNamespace: true

# Node architecture selector (set to "" to disable). Releases publish the
# operator, API and bridge images for amd64 and arm64; the classic scanner
# images (nmap, nikto, tsunami) are amd64 only, so the selector stays.
nodeSelector:
  kubernetes.io/arch: amd64

# ServiceAccounts (README, "RBAC"). The operator gets a ClusterRole for
# Ingresses, Scanners and events plus a namespaced Role for Jobs and
# CronJobs; the API and the bridge get namespaced Roles; scanner pods run
# under an account with no rights and no mounted token.
serviceAccounts:
  operator: samma-operator
  api: samma-api
  bridge: samma-bridge
  scanner: samma-scanner

# Images. Every component takes image, tag, digest and pullPolicy:
#   tag     empty means the chart's appVersion (the release the chart came
#           from), which is how a release pins its own images.
#   digest  "sha256:..." renders image@digest instead of image:tag and wins
#           over the tag. Release notes list the digest of every image.
# Operator component
operator:
  image: ghcr.io/samma-io/samma-operator
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  # The uid and gid the pod runs as. The image creates its user with uid 1000.
  # A numeric id is what lets the kubelet verify runAsNonRoot; a named user
  # in the image is refused with CreateContainerConfigError.
  runAsUser: 1000
  runAsGroup: 1000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi

# Which namespaces' Ingresses the operator handles (README, "Ingress
# annotations"). Empty means only the operator's own namespace; '*' watches
# all namespaces (the behaviour before this restriction).
ingress:
  watchNamespaces: []

# Scanner Jobs and CronJobs the operator creates (README, "Scan Jobs and CronJobs").
scanners:
  # The detect scanners (github.com/samma-io/detect) are released together,
  # so one tag covers all of them: ghcr.io/samma-io/detect-<name>:<detectTag>.
  # This is the detect release the operator was tested with.
  detectTag: "2.0.2"
  # The scanners detectTag applies to (the operator's own table has the same
  # names).
  detectScanners:
    - dns-scanner
    - http-headers-scanner
    - http-redirect-scanner
    - port-scanner
    - ssh-banner-scanner
    - tls-scanner
    - traceroute-scanner
    - whois-scanner
  # The rebuilt classic images (github.com/samma-io/nmap and samma-io/nikto),
  # each released on its own: ghcr.io/samma-io/<name>:<tag>. These are the
  # builds the operator was tested with. tsunami and base keep the defaults
  # in operator/code/jobspec.py.
  classicTags:
    nikto: sha-362c174
    nmap: sha-6e0042c
  # imagePrefix replaces the registry and organisation of every scanner
  # image, keeping the image's base name (a mirror of the detect images
  # becomes <imagePrefix>/detect-dns-scanner:<imageTag, else detectTag>;
  # nmap becomes <imagePrefix>/nmap:<imageTag, else classicTags.nmap>).
  imagePrefix: ""
  imageTag: ""
  # imagePullPolicy for scanner containers; empty keeps the Kubernetes default.
  pullPolicy: IfNotPresent
  # A full reference for one scanner, with a tag or a digest. Wins over
  # everything above for that scanner.
  images: {}
  #  nmap: ghcr.io/samma-io/nmap@sha256:0123abcd...
  #  dns-scanner: ghcr.io/samma-io/detect-dns-scanner@sha256:0123abcd...
  # The legacy base scanner ships its files with a filebeat sidecar that
  # mounts the filebeat and live ConfigMaps. true creates them at startup;
  # nothing else uses them, and the detect scanners publish to NATS.
  legacyBaseScanner: false
  # Requests and limits of every scanner container.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # How many scan Jobs may run at the same time. A Scanner's first Jobs wait
  # in a queue for a free slot; CronJob runs count towards the limit.
  # 0 removes the limit.
  maxConcurrentScans: 2
  # activeDeadlineSeconds of every scan Job: a scan still running after this
  # is stopped and marked failed.
  scanDeadlineSeconds: 900
  # Finished Jobs are removed after this many seconds.
  ttlSecondsAfterFinished: 3600
  # true adds the NET_RAW capability to the nmap containers (SYN scans).
  # false keeps every scanner at drop ALL and asks nmap for connect scans
  # through NMAP_UNPRIVILEGED, which the ghcr.io/samma-io/nmap image honours.
  # true runs the image's NET_RAW-capable nmap copy (file capability), which
  # needs allowPrivilegeEscalation; the chart keeps it for nmap only.
  nmapRawSockets: false
  # The uid scanner containers run as. The samma images create their user
  # with useradd, which gives uid 1000.
  runAsUser: 1000

# Uninstall hook: a pre-delete Job that removes every Scanner (and the Jobs
# and CronJobs of older releases) before the operator and the CRD go away,
# so `helm uninstall` never blocks on CRD removal.
hooks:
  preDeleteCleanup: true

# API component: the REST interface for targets and scanners. Not needed
# when targets come from Ingress annotations or Scanner resources.
api:
  enabled: true
  image: ghcr.io/samma-io/samma-api
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  # The uid and gid the pod runs as (the image's user is uid 1000).
  runAsUser: 1000
  runAsGroup: 1000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi
  # The bearer token the API requires on every request (SAMMA_API_TOKEN,
  # operator#15); it refuses to start without one. One of the two below is
  # required when api.enabled is true: set token (the chart puts it in the
  # Secret samma-api-token) or existingSecret (a Secret of your own with the
  # key "token"). Prefer existingSecret under GitOps — a --set api.token
  # lands in the rendered manifests. There is no default.
  token: ""
  existingSecret: ""

# NATS message broker (README, "NATS authentication", "External NATS")
nats:
  # Deploy the bundled NATS (Deployment, Service, the nats-config ConfigMap,
  # the samma-nats-auth Secret and the samma-nats NetworkPolicy). false
  # deploys none of them: the operator, the bridge and every scanner pod
  # connect to config.natsUrl, a NATS you run, which must accept publishes
  # from nats.auth.scannerUser and subscriptions from nats.auth.bridgeUser
  # on config.natsSubject and <natsSubject>.> with the passwords in
  # nats.existingSecret (required then), or take anonymous connections with
  # nats.auth.enabled=false. Set networkPolicies.externalNats too.
  enabled: true
  image: nats
  tag: "2"
  digest: "sha256:023a08c46caa5aff878fb86841187bebfdad9a6e3c552ba5c1a1e18938bbf88a"
  pullPolicy: IfNotPresent
  # The nats image has no user of its own and the server needs no writable
  # path, so it runs read-only as this unprivileged uid and gid.
  runAsUser: 1000
  runAsGroup: 1000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  # A Secret of your own with the keys scanner-password and bridge-password.
  # Empty: the chart manages the Secret samma-nats-auth itself.
  existingSecret: ""
  # Serves the NATS HTTP monitoring endpoint on 8222 when true: the `http`
  # line in the server config, the container port, the Service port and the
  # samma-nats policy entry all follow this switch.
  monitoring: false
  auth:
    # false runs NATS without authentication (the behaviour before this
    # chart version): no Secret, no credentials in any pod.
    enabled: true
    # scanner may only publish on the scan subjects, bridge may only
    # subscribe to them.
    scannerUser: scanner
    bridgeUser: bridge
    # Passwords, alphanumeric (they travel in the scanner pods' NATS URL).
    # Empty: kept from the Secret already in the cluster, else generated at
    # install. `helm template` has no cluster to read from and generates new
    # ones on every render; set them, or use existingSecret, when a GitOps
    # tool renders the chart.
    scannerPassword: ""
    bridgePassword: ""

# NetworkPolicies for NATS, the bridge and the scanner pods (README,
# "Network policies"). Enforced only by a CNI that implements NetworkPolicy.
networkPolicies:
  enabled: true
  # How the bridge reaches the Kubernetes API server, which is not a pod:
  # by port to any address, or to the given CIDRs only.
  apiServer:
    ports: [443, 6443]
    cidrs: []
  # Namespaces allowed to reach the API on 8080 (the samma-api policy),
  # matched through the automatic kubernetes.io/metadata.name label every
  # namespace carries. The dashboard's namespace must be listed here, or
  # its calls to the API are dropped; listing a namespace allows every pod
  # in it. Pods of the release namespace are always allowed.
  apiClients: []
  # Namespaces allowed to reach TimescaleDB on 5432 (the samma-timescaledb
  # policy), matched through the automatic kubernetes.io/metadata.name
  # label every namespace carries. Listing a namespace allows every pod in
  # it on 5432. The samma.io dashboard's namespace must be listed for it to
  # read scan_results; same for any Grafana namespace. Empty allows only
  # the bridge pod (in the release namespace).
  timescaledbClients: []
  # With nats.enabled=false: how the bridge and the scanner pods reach the
  # external NATS at config.natsUrl. A NetworkPolicy cannot name a host, so
  # list its address or its pods as NetworkPolicyPeers, for example
  #   to:
  #     - ipBlock: {cidr: 192.0.2.10/32}
  #     - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: nats}}
  #       podSelector: {matchLabels: {app.kubernetes.io/name: nats}}
  # Empty allows the ports below to any address, private ones included.
  # Ignored while nats.enabled is true (the bundled NATS pod is selected).
  externalNats:
    ports: [4222]
    to: []

# TimescaleDB: scan results storage for Grafana. false installs no database
# and no PVC; the bridge then writes ScanReports only (bridge.storeInTimescaleDB
# is ignored).
timescaledb:
  enabled: true
  image: timescale/timescaledb
  tag: latest-pg15
  digest: "sha256:6343bdc87ca132c6b53acb26113a6bad1821d188fa39975a745f32ddd9757634"
  pullPolicy: IfNotPresent
  storage: 10Gi
  # storageClass: "" # set to use a specific StorageClass
  db: samma
  user: samma
  # The database password. Required when enabled: set password (the chart
  # puts it in the Secret samma-timescaledb) or existingSecret (a Secret of
  # your own with the key "password"). Alphanumeric: it travels in the
  # bridge's DATABASE_URL. There is no default.
  password: ""
  existingSecret: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Bridge: NATS to ScanReports and TimescaleDB (README, "Scan reports")
bridge:
  image: ghcr.io/samma-io/samma-bridge
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  # The uid and gid the pod runs as (the image's user is uid 1000).
  runAsUser: 1000
  runAsGroup: 1000
  # Write ScanReport objects from schema v2 messages.
  scanReports: true
  # Insert every message into TimescaleDB as before. false leaves the
  # bridge with no database at all; so does timescaledb.enabled=false.
  storeInTimescaleDB: true
  # How long the list of Scanners (used to drop messages for unknown
  # targets) is cached, and how long a run waits for findings that are
  # still in flight after its run message.
  scannerCacheSeconds: 30
  stragglerWaitSeconds: 30
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Shared scanner configuration
config:
  sammaIoId: ""
  sammaIoTags: "['scanner']"
  sammaIoJson: "{}"
  writeToFile: "true"
  # NATS. The operator hands natsUrl and natsSubject to every scanner Job
  # and CronJob (scanners publish on <natsSubject>.<scanner>) and the bridge
  # subscribes there. They come from these values only, never from a
  # Scanner or a target. The default is the bundled NATS's Service; with
  # nats.enabled=false point it at your own NATS.
  natsUrl: "nats://nats:4222"
  natsEnabled: "True"
  natsSubject: "samma-io.scan"
  # External samma.io API (leave apiToken empty to disable)
  apiUrl: "https://www.samma.io"
  apiToken: ""
  profileId: ""
  # Target validation (README, "Target validation").
  # "true" lets a Scanner target a private, loopback or link-local address.
  allowPrivateTargets: "false"
  # "false" refuses a Scanner whose target is not an Ingress host in the cluster.
  allowUnmanagedTargets: "true"
