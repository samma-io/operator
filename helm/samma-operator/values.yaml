# Namespace to deploy into
namespace: samma-io

# Node architecture selector (set to "" to disable)
nodeSelector:
  kubernetes.io/arch: amd64

# Operator component
operator:
  image: mattiashem/samma-operator
  tag: latest
  digest: sha256:a1c718acbef760fb660a8bfec72a722261111e112ccfd57f5475344eca315613
  pullPolicy: Always
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi

# API component
api:
  image: sammascanner/api
  tag: latest
  digest: sha256:0cb8f1b94292ea30d850c82db0f3dda02999595841d871431f77d3cb90185dfb
  pullPolicy: Always
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi

# NATS message broker
nats:
  image: nats
  tag: "2"
  digest: sha256:023a08c46caa5aff878fb86841187bebfdad9a6e3c552ba5c1a1e18938bbf88a
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# TimescaleDB — scan results storage
timescaledb:
  image: timescale/timescaledb
  tag: latest-pg15
  digest: sha256:6343bdc87ca132c6b53acb26113a6bad1821d188fa39975a745f32ddd9757634
  storage: 10Gi
  # storageClass: "" # set to use a specific StorageClass
  db: samma
  user: samma
  password: samma   # override in production!
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Bridge — NATS → TimescaleDB
bridge:
  image: sammascanner/bridge
  tag: latest
  digest: sha256:043ae17d18926b5d0b57058a6b10d845f73723a6bb17eb65031162501eda42c3
  pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Shared scanner configuration
config:
  sammaIoId: ""
  sammaIoTags: "['scanner']"
  sammaIoJson: "{}"
  writeToFile: "true"
  # NATS
  natsUrl: "nats://nats:4222"
  natsEnabled: "True"
  natsSubject: "samma-io.scan"
  # External samma.io API (leave apiToken empty to disable)
  apiUrl: "https://www.samma.io"
  apiToken: ""
  profileId: ""
  # Target validation (README, "Target validation").
  # "true" lets a Scanner target a private, loopback or link-local address.
  allowPrivateTargets: "false"
  # "false" refuses a Scanner whose target is not an Ingress host in the cluster.
  allowUnmanagedTargets: "true"
