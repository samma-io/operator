# The operator performs active security scans, from inside the cluster,
# against the hosts the cluster's Ingresses serve (and against any target a
# Scanner resource names). Only scan hosts you are allowed to scan. The chart
# refuses to render the operator until this is true:
#
#   --set acceptScanningTerms=true
acceptScanningTerms: false

# Namespace to deploy into
namespace: samma-io

# Create the Namespace as part of the release (the upstream default). Set to
# false when the namespace exists already, for example when a GitOps tool or
# `helm install --create-namespace` makes it.
createNamespace: true

# Node architecture selector (set to "" to disable). Releases publish the
# operator, API and bridge images for amd64 and arm64; the classic scanner
# images (nmap, nikto, tsunami) are amd64 only, so the selector stays.
nodeSelector:
  kubernetes.io/arch: amd64

# ServiceAccounts (README, "RBAC"). The operator gets a ClusterRole for
# Ingresses, Scanners and events plus a namespaced Role for Jobs and
# CronJobs; the API and the bridge get namespaced Roles; scanner pods run
# under an account with no rights and no mounted token.
serviceAccounts:
  operator: samma-operator
  api: samma-api
  bridge: samma-bridge
  scanner: samma-scanner

# Images. Every component takes image, tag, digest and pullPolicy:
#   tag     empty means the chart's appVersion (the release the chart came
#           from), which is how a release pins its own images.
#   digest  "sha256:..." renders image@digest instead of image:tag and wins
#           over the tag. Release notes list the digest of every image.
# Operator component
operator:
  image: ghcr.io/samma-io/samma-operator
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi

# Scanner Jobs and CronJobs the operator creates (README, "Scan Jobs and CronJobs").
scanners:
  # The detect scanners (github.com/samma-io/detect) are released together,
  # so one tag covers all of them: ghcr.io/samma-io/detect-<name>:<detectTag>.
  # This is the detect release the operator was tested with.
  detectTag: "2.0.0"
  # The scanners detectTag applies to (the operator's own table has the same
  # names). The classic images (nmap, nikto, tsunami) keep the defaults in
  # operator/code/jobspec.py until they are rebuilt.
  detectScanners:
    - dns-scanner
    - http-headers-scanner
    - http-redirect-scanner
    - port-scanner
    - ssh-banner-scanner
    - tls-scanner
    - traceroute-scanner
    - whois-scanner
  # imagePrefix replaces the registry and organisation of every scanner
  # image, keeping the image's base name (a mirror of the detect images
  # becomes <imagePrefix>/detect-dns-scanner:<imageTag, else detectTag>; a
  # classic image becomes <imagePrefix>/nmap:<imageTag, else its default tag>).
  imagePrefix: ""
  imageTag: ""
  # imagePullPolicy for scanner containers; empty keeps the Kubernetes default.
  pullPolicy: IfNotPresent
  # A full reference for one scanner, with a tag or a digest. Wins over
  # everything above for that scanner.
  images: {}
  #  nmap: ghcr.io/samma-io/nmap:v0.3
  #  dns-scanner: ghcr.io/samma-io/detect-dns-scanner@sha256:0123abcd...
  # Requests and limits of every scanner container.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # How many scan Jobs may run at the same time. A Scanner's first Jobs wait
  # in a queue for a free slot; CronJob runs count towards the limit.
  # 0 removes the limit.
  maxConcurrentScans: 2
  # activeDeadlineSeconds of every scan Job: a scan still running after this
  # is stopped and marked failed.
  scanDeadlineSeconds: 900
  # Finished Jobs are removed after this many seconds.
  ttlSecondsAfterFinished: 3600
  # true adds the NET_RAW capability to the nmap containers (SYN scans).
  # false keeps every scanner at drop ALL and asks nmap for connect scans
  # through NMAP_UNPRIVILEGED; the nmap image has to honour that.
  nmapRawSockets: false
  # The uid scanner containers run as. The samma images create their user
  # with useradd, which gives uid 1000.
  runAsUser: 1000

# Uninstall hook: a pre-delete Job that removes every Scanner (and the Jobs
# and CronJobs of older releases) before the operator and the CRD go away,
# so `helm uninstall` never blocks on CRD removal.
hooks:
  preDeleteCleanup: true

# API component: the REST interface for targets and scanners. Not needed
# when targets come from Ingress annotations or Scanner resources.
api:
  enabled: true
  image: ghcr.io/samma-io/samma-api
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi

# NATS message broker (README, "NATS authentication")
nats:
  image: nats
  tag: "2"
  digest: ""
  pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  # A Secret of your own with the keys scanner-password and bridge-password.
  # Empty: the chart manages the Secret samma-nats-auth itself.
  existingSecret: ""
  auth:
    # false runs NATS without authentication (the behaviour before this
    # chart version): no Secret, no credentials in any pod.
    enabled: true
    # scanner may only publish on the scan subjects, bridge may only
    # subscribe to them.
    scannerUser: scanner
    bridgeUser: bridge
    # Passwords, alphanumeric (they travel in the scanner pods' NATS URL).
    # Empty: kept from the Secret already in the cluster, else generated at
    # install. `helm template` has no cluster to read from and generates new
    # ones on every render; set them, or use existingSecret, when a GitOps
    # tool renders the chart.
    scannerPassword: ""
    bridgePassword: ""

# NetworkPolicies for NATS, the bridge and the scanner pods (README,
# "Network policies"). Enforced only by a CNI that implements NetworkPolicy.
networkPolicies:
  enabled: true
  # How the bridge reaches the Kubernetes API server, which is not a pod:
  # by port to any address, or to the given CIDRs only.
  apiServer:
    ports: [443, 6443]
    cidrs: []

# TimescaleDB: scan results storage for Grafana. false installs no database
# and no PVC; the bridge then writes ScanReports only (bridge.storeInTimescaleDB
# is ignored).
timescaledb:
  enabled: true
  image: timescale/timescaledb
  tag: latest-pg15
  digest: ""
  pullPolicy: IfNotPresent
  storage: 10Gi
  # storageClass: "" # set to use a specific StorageClass
  db: samma
  user: samma
  # The database password. Required when enabled: set password (the chart
  # puts it in the Secret samma-timescaledb) or existingSecret (a Secret of
  # your own with the key "password"). Alphanumeric: it travels in the
  # bridge's DATABASE_URL. There is no default.
  password: ""
  existingSecret: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Bridge: NATS to ScanReports and TimescaleDB (README, "Scan reports")
bridge:
  image: ghcr.io/samma-io/samma-bridge
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  # Write ScanReport objects from schema v2 messages.
  scanReports: true
  # Insert every message into TimescaleDB as before. false leaves the
  # bridge with no database at all; so does timescaledb.enabled=false.
  storeInTimescaleDB: true
  # How long the list of Scanners (used to drop messages for unknown
  # targets) is cached, and how long a run waits for findings that are
  # still in flight after its run message.
  scannerCacheSeconds: 30
  stragglerWaitSeconds: 30
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Shared scanner configuration
config:
  sammaIoId: ""
  sammaIoTags: "['scanner']"
  sammaIoJson: "{}"
  writeToFile: "true"
  # NATS
  natsUrl: "nats://nats:4222"
  natsEnabled: "True"
  natsSubject: "samma-io.scan"
  # External samma.io API (leave apiToken empty to disable)
  apiUrl: "https://www.samma.io"
  apiToken: ""
  profileId: ""
  # Target validation (README, "Target validation").
  # "true" lets a Scanner target a private, loopback or link-local address.
  allowPrivateTargets: "false"
  # "false" refuses a Scanner whose target is not an Ingress host in the cluster.
  allowUnmanagedTargets: "true"
