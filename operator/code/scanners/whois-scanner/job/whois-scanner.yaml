apiVersion: batch/v1
kind: Job
metadata:
  name: {{ NAME }}
spec:
  #Operator-created Jobs have no ownerReference, so nothing else ever
  #removes them. Without this they accumulate forever.
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      containers:
      - name: whois-scanner
        image: ghcr.io/samma-io/detect-whois-scanner:latest
        env:
          - name: TARGET
            value: {{ TARGET }}
          - name: SAMMA_IO_SCANNER
            value: whois-scanner
        {% for user in ENV %}
          - name: {{ user }}
            value: "{{ ENV[user] }}"
        {% endfor %}
      restartPolicy: Never
