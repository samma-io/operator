---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ NAME }}
spec:
  #Operator-created Jobs have no ownerReference, so nothing else ever
  #removes them. Without this they accumulate forever.
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      containers:
      - name: nikto
        image: sammascanner/nikto:v0.2
        env:
          - name: TARGET
            value: {{ TARGET }}
          - name: SAMMA_IO_SCANNER
            value: nikto
        {% for user in ENV %}
          - name: {{ user }}
            value: "{{ ENV[user] }}"
        {% endfor %}
      restartPolicy: Never
