---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: samma-api
  namespace: samma-io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: samma-api
subjects:
  - kind: ServiceAccount
    name: samma-api
    namespace: samma-io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: samma-bridge
  namespace: samma-io
---
apiVersion: rbac.authorization.k8s.io/v1
