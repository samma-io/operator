apiVersion: v1
kind: Namespace
metadata:
  name: samma-io
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scanner.samma.io
spec:
  scope: Namespaced
  group: samma.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                target:
                  # A DNS hostname (lowercase labels, no wildcard, no scheme,
                  # no path) or an IPv4/IPv6 literal. The operator checks the
                  # same expression again in operator/code/target_policy.py.
                  type: string
                  maxLength: 253
                  pattern: '^([a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*|((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])|[0-9a-fA-F]{0,4}(:[0-9a-fA-F]{0,4}){2,7})$'
                ip:
                  type: string
                scheduler:
                  # Five cron fields, a CronJob @-macro, or "none".
                  type: string
                  maxLength: 128
                  pattern: '^\s*(none|@(yearly|annually|monthly|weekly|daily|midnight|hourly)|([A-Za-z0-9*/,?-]+\s+){4}[A-Za-z0-9*/,?-]+)\s*$'
                scanners:
                  type: array
                  items:
                    # A scanner directory name, optionally with /template.
                    type: string
                    maxLength: 128
                    pattern: '^[a-z0-9-]+(/[a-z0-9-]+)?$'
                samma_io_json:
                  type: string
                samma_io_id:
                  type: string
                  pattern: '^[A-Za-z0-9_.-]{0,128}$'
                samma_io_tags:
                  type: array
                  items:
                    type: string
                    pattern: '^[A-Za-z0-9_.-]{1,63}$'
                write_to_file:
                  type: string
                elasticsearch:
                  type: string
                templates:
                  type: array
                  items:
                    type: string
                profile:
                  type: string
  names:
    kind: Scanner
    plural: scanner
    singular: scanner
    shortNames:
      - sc
---
# Least-privilege RBAC. Keep in sync with helm/samma-operator/templates/rbac.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: samma-operator
  namespace: samma-io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: samma-operator
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["samma.io"]
    resources: ["scanner", "scanner/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["samma.io"]
    resources: ["scanreports", "scanreports/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: samma-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: samma-operator
subjects:
  - kind: ServiceAccount
    name: samma-operator
    namespace: samma-io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: samma-operator
  namespace: samma-io
rules:
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: samma-operator
  namespace: samma-io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: samma-operator
subjects:
  - kind: ServiceAccount
    name: samma-operator
    namespace: samma-io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: samma-api
  namespace: samma-io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: samma-api
  namespace: samma-io
rules:
  - apiGroups: ["samma.io"]
    resources: ["scanner"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: samma-api
  namespace: samma-io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: samma-api
subjects:
  - kind: ServiceAccount
    name: samma-api
    namespace: samma-io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: samma-bridge
  namespace: samma-io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: samma-bridge
  namespace: samma-io
rules:
  - apiGroups: ["samma.io"]
    resources: ["scanreports", "scanreports/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["samma.io"]
    resources: ["scanner"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: samma-bridge
  namespace: samma-io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: samma-bridge
subjects:
  - kind: ServiceAccount
    name: samma-bridge
    namespace: samma-io
---
# Scanner pods: no rules bound, no token mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: samma-scanner
  namespace: samma-io
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: samma-operator
  namespace: samma-io
spec:
  selector:
    matchLabels:
      app: samma-operator
  template:
    metadata:
      labels:
        app: samma-operator
    spec:
      serviceAccountName: samma-operator
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: samma-operator
          image: mattiashem/samma-operator:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SAMMA_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SAMMA_IO_ID
              value: ""
            - name: SAMMA_IO_TAGS
              value: "['scanner']"
            - name: SAMMA_IO_JSON
              value: "{}"
            - name: WRITE_TO_FILE
              value: "true"
            - name: SAMMA_IO_API_URL
              value: "https://www.samma.io"
            - name: SAMMA_IO_API_TOKEN
              value: ""
            - name: SAMMA_IO_PROFILE_ID
              value: ""
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: NATS_ENABLED
              value: "True"
            - name: NATS_SUBJECT
              value: "samma-io.scan"
            - name: SAMMA_ALLOW_PRIVATE_TARGETS
              value: "false"
            - name: SAMMA_ALLOW_UNMANAGED_TARGETS
              value: "true"
            # Scanner Jobs and CronJobs (README, "Scan Jobs and CronJobs")
            - name: SAMMA_SCANNER_SERVICE_ACCOUNT
              value: "samma-scanner"
            - name: SAMMA_MAX_CONCURRENT_SCANS
              value: "2"
            - name: SAMMA_SCAN_DEADLINE_SECONDS
              value: "900"
            - name: SAMMA_JOB_TTL_SECONDS
              value: "3600"
            - name: SAMMA_NMAP_RAW_SOCKETS
              value: "false"
            - name: SAMMA_SCANNER_RUN_AS_USER
              value: "1000"
            - name: SAMMA_SCANNER_IMAGE_PREFIX
              value: ""
            - name: SAMMA_SCANNER_IMAGE_TAG
              value: ""
            - name: SAMMA_SCANNER_IMAGE_PULL_POLICY
              value: ""
            - name: SAMMA_SCANNER_CPU_REQUEST
              value: "100m"
            - name: SAMMA_SCANNER_MEMORY_REQUEST
              value: "128Mi"
            - name: SAMMA_SCANNER_CPU_LIMIT
              value: "1"
            - name: SAMMA_SCANNER_MEMORY_LIMIT
              value: "512Mi"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: operator
  namespace: samma-io
spec:
  selector:
    app: samma-operator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: samma-api
  namespace: samma-io
spec:
  selector:
    matchLabels:
      app: samma-api
  template:
    metadata:
      labels:
        app: samma-api
    spec:
      serviceAccountName: samma-api
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: samma-api
          image: sammascanner/api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SAMMA_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SAMMA_IO_ID
              value: ""
            - name: SAMMA_IO_TAGS
              value: "['scanner']"
            - name: SAMMA_IO_JSON
              value: "{}"
            - name: WRITE_TO_FILE
              value: "true"
            - name: SAMMA_IO_API_URL
              value: "https://www.samma.io"
            - name: SAMMA_IO_API_TOKEN
              value: ""
            - name: SAMMA_IO_PROFILE_ID
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: samma-io
spec:
  selector:
    app: samma-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: samma-io
spec:
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: nats
          image: nats:2
          ports:
            - containerPort: 4222
            - containerPort: 8222
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: samma-io
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: timescaledb-pvc
  namespace: samma-io
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timescaledb
  namespace: samma-io
spec:
  selector:
    matchLabels:
      app: timescaledb
  template:
    metadata:
      labels:
        app: timescaledb
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: timescaledb
          image: timescale/timescaledb:latest-pg15
          env:
            - name: POSTGRES_DB
              value: samma
            - name: POSTGRES_USER
              value: samma
            - name: POSTGRES_PASSWORD
              value: samma
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: timescaledb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  namespace: samma-io
spec:
  selector:
    app: timescaledb
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: samma-bridge
  namespace: samma-io
spec:
  selector:
    matchLabels:
      app: samma-bridge
  template:
    metadata:
      labels:
        app: samma-bridge
    spec:
      serviceAccountName: samma-bridge
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: samma-bridge
          image: sammascanner/bridge:latest
          imagePullPolicy: Always
          env:
            - name: NATS_URL
              value: nats://nats:4222
            - name: NATS_SUBJECT
              value: samma-io.scan
            - name: DATABASE_URL
              value: postgresql://samma:samma@timescaledb:5432/samma
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
# Uninstall: the Helm chart runs operator/code/uninstall_cleanup.py from a
# pre-delete hook. With the raw manifest, delete every Scanner first:
#   kubectl -n samma-io delete scanner --all
# Their Jobs and CronJobs follow through garbage collection; then
#   kubectl delete -f manifest/samma-operator.yaml
