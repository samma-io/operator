metadata:
  name: samma-operator
  namespace: samma-io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: samma-operator
subjects:
  - kind: ServiceAccount
    name: samma-operator
    namespace: samma-io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: samma-api
