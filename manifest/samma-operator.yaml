apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: samma-bridge
  namespace: samma-io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: samma-bridge
subjects:
